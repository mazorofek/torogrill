services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - artifacts/api-server/.env
    environment:
      NODE_ENV: production

  web:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    depends_on:
      - api
    ports:
      - "8080:80"
